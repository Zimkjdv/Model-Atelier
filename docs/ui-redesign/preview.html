function training(){

const pending=reviewRecords.map((r,i)=>({r,i})).filter(({r})=>!r.caption.trim()||!r.source.trim());

const exporting=`<section class="panel training-export"><h3>匯出前檢查</h3>${[['圖片描述已填寫',true],['來源'+(pending.length?'仍缺 '+pending.length+' 項':'已補齊'),pending.length===0],['分組已指定',true]].map(([label,ok])=>`<div class="training-check-row"><strong>${label}</strong><span class="training-chip ${ok?'success':'warm'}">${ok?'通過':'需處理'}</span></div>`).join('')}</section><div class="training-stage-actions"><button class="primary" data-stage="0">回到待補項目</button>${pending.length?'<button disabled>匯出資料包（尚有缺項）</button>':demo('匯出資料包')}</div><p class="help training-note">建立固定資料版本；開發評估與排除圖不會混入 train-only 訓練集。</p>`;
const preparing=`<section class="panel"><h3>準備新的訓練</h3><p class="help training-preparing-help">這一步只凍結設定，不會開始訓練。</p><div class="row"><label class="field"><span>名稱</span><input value="山巒風格 · 第一輪"></label><label class="field"><span>基礎模型</span><select><option>SDXL · 示意 A</option></select></label></div>${pending.length?'<div class="training-notice">資料還有缺項，暫時無法準備。</div><button disabled>準備訓練</button>':demo('準備訓練')}<details class="training-extra"><summary>凍結設定與明確開始</summary><p>正式版會保留固定版本、互斥檢查、準備 run、明確開始、原 UUID 恢復及對應錯誤處理。</p></details></section>`;
const running=`<div class="training-run-grid"><section class="panel"><h3>示意訓練紀錄</h3><div class="training-kpi">620 <small>/ 1,000 steps</small></div><div class="training-meter"><span style="width:62%"></span></div><p class="help training-run-help">此為展示用紀錄，與左側審查中的資料無關。</p><div class="training-run-actions">${demo('停止訓練')}${demo('查看日誌')}</div><details class="training-extra"><summary>凍結設定、原請求與資源</summary><p>保留原 run 設定、UUID 恢復、資源取樣及日誌；續訓建立新 run 並保留來源，不覆寫原紀錄。</p></details></section><section class="panel"><h3>完成後</h3><p class="help training-next-help">安裝產物 → 登錄模型 → 固定條件比較。</p><button data-page="experiments">前往實驗比較</button><details class="training-extra"><summary>產物、回登與歷史報告</summary><p>保留 receipt、產物安裝、模型回登、固定比較、原 run 選擇與報告下載。</p></details></section></div>`;
return `<div class="page-heading training-heading"><div><p>從資料品質開始，每個階段都清楚說明下一步。</p></div><div>${demo('查看歷史報告')}</div></div><div class="stagebar" role="group" aria-label="訓練階段">${stages.map((name,i)=>`<button data-stage="${i}" aria-pressed="${stage===i}"><b>${i+1}</b>${name}<small>${descriptions[i]}</small></button>`).join('')}</div>${scenario==='empty'?empty('尚未建立訓練資料集','先依既有 T02 清單準備資料，再匯入進行逐張審查。','assets'):`<div class="review-progress"><div><span>${12-pending.length} / 12 已審查</span><span>${pending.length} 張待補</span></div><progress max="12" value="${12-pending.length}" aria-label="資料審查進度"></progress></div>`+[review,exporting,preparing,running][stage]}`
}

function system(){
const unknown=scenario==='empty',warning=scenario==='warning',offline=scenario==='offline'||warning;

const pct=(u,t)=>Math.round(u/t*100),num=n=>n.toLocaleString('en-US');
const icon=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const refreshIcon=icon('<path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5"/>');
const folderIcon=icon('<path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/>');
const button=(label,attrs='',style='')=>`<button class="sys-btn ${style}" ${attrs}>${label}</button>`;
const chip=(text,kind='')=>`<span class="sys-chip ${kind}">${text}</span>`;
const facts=(entries,two=false)=>`<dl class="sys-facts ${two?'sys-two':''}">${entries.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
const meter=(label,u,t,missing=unknown)=>missing?`<div class="sys-m sys-pending" role="img" aria-label="${label}用量未知"></div>`:`<div class="sys-m ${pct(u,t)>=85?'sys-warn':''}" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="${t}" aria-valuenow="${u}" aria-valuetext="已用 ${num(u)} / ${num(t)} GB · ${pct(u,t)}%"><b style="width:${u/t*100}%"></b></div>`;
const row=(label,u,t,missing=unknown)=>`<div class="sys-rowm"><div class="sys-l"><span>${label}</span><b>${missing?'未知':num(u)+' / '+num(t)+' GB · '+pct(u,t)+'%'}</b></div>${meter(label,u,t,missing)}</div>`;
const link=(label,tab,target='')=>`<button class="sys-link" data-system-tab="${tab}" ${target?`data-system-target="${target}"`:''}>${label}</button>`;
const issues=[];
if(offline)issues.push({title:'引擎離線',description:'無法取得引擎版本與裝置。生成與訓練需要恢復連線。',action:button('前往設定','data-connect-settings','sys-s'),kind:'sys-w'});
if(warning)issues.push({title:'C: 剩餘 7%',description:'平台資料與受管理引擎都在這個磁碟。',action:button('管理目錄','data-system-tab="2" data-system-target="system-directories"','sys-s'),kind:'sys-w'});
if(scenario==='missing')issues.push({title:'FLUX 缺少必要元件',description:'缺少 VAE；只阻擋受影響的流程，其他模型仍可使用。',action:button('查看元件','data-missing-flux','sys-s'),kind:'sys-w'});
if(unknown)issues.push({title:'主機、引擎與容量尚無資料',description:'資料來源分開處理，未知不顯示為 0。',action:button('查看資料來源','data-system-tab="0" data-system-target="system-sources"','sys-s'),kind:''});
issues.push({title:'本機 ComfyUI 安裝尚未檢查',description:'檢查只讀取環境資訊，不會生成圖片。',action:button('檢查安裝','data-system-tab="3" data-system-target="local-info"','sys-s'),kind:''});
const actions=issues.filter(i=>i.kind==='sys-w').length,pending=issues.length-actions;

const segmented=unknown?'<div class="sys-m sys-pending" role="img" aria-label="儲存用量未知"></div>':`<div class="sys-m sys-seg" role="meter" aria-label="儲存空間分類用量" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${used}" aria-valuetext="模型 820 GB，作品 96 GB，其他 ${other} GB，已用 ${num(used)} / ${num(total)} GB · ${pct(used,total)}%"><b style="width:${820/total*100}%"></b><b style="width:${96/total*100}%"></b><b style="width:${other/total*100}%"></b></div>`;
const cards=`<div class="sys-cards" aria-label="系統健康摘要">
<section class="sys-card" aria-label="主機"><div class="sys-t"><h2>主機</h2>${chip(unknown?'未偵測':'正常',unknown?'':'sys-g')}</div><div class="sys-kpi">${val('RTX 4080')}</div>${row('顯存',4,16)}${row('記憶體',24,64)}<div class="sys-go">${link('查看主機詳情 →',1,'host-info')}</div></section>
<section class="sys-card" aria-label="引擎"><div class="sys-t"><h2>引擎</h2>${chip(offline?'離線':unknown?'未偵測':'已連線',offline?'sys-w':unknown?'':'sys-g')}</div><div class="sys-kpi">ComfyUI</div>${facts([['版本',eng('示意版本')],['PyTorch',eng('示意版本')]],true)}<p class="sys-note">${offline||unknown?'未取得回報，未知不顯示為 0。':'http://127.0.0.1:8188 · 更新於 10:42'}</p><div class="sys-go">${link('查看引擎詳情 →',1,'engine-info')}</div></section>
<section class="sys-card" aria-label="儲存空間"><div class="sys-t"><h2>儲存空間</h2>${chip(unknown?'未知':warning?'C: 剩餘 7%':'剩餘 '+pct(free,total)+'%',warning?'sys-w':unknown?'':'sys-g')}</div><div class="sys-kpi">${unknown?'未知':num(used)+' <small>/ '+num(total)+' GB · '+pct(used,total)+'%</small>'}</div>${segmented}<div class="sys-legend"><div><span><i></i>模型</span><strong>${val('820 GB')}</strong></div><div><span><i></i>作品</span><strong>${val('96 GB')}</strong></div><div><span><i></i>其他</span><strong>${val(num(other)+' GB')}</strong></div></div><div class="sys-go">${link('查看目錄與磁碟 →',2,'storage-info')}</div></section></div>`;

document.addEventListener('input',e=>{const settingsKey={'settings-engine-url':'settingsEngineUrl','settings-model-paths':'settingsPaths','settings-diagnostic-job':'diagnosticJob','settings-diagnostic-request':'diagnosticRequest'}[e.target.id];if(settingsKey){ui[settingsKey]=e.target.value;if(settingsKey==='settingsPaths'){const result=document.getElementById('path-check-results');if(result)result.innerHTML=pathCheckRows()}return}const reviewKey={'review-caption':'caption','review-source':'source','review-group':'group'}[e.target.id];if(reviewKey){ui.reviewDrafts[ui.reviewIndex]??={...reviewRecords[ui.reviewIndex]};ui.reviewDrafts[ui.reviewIndex][reviewKey]=e.target.value;return}if(e.target.dataset.artworkNote!==undefined){records[+e.target.dataset.artworkNote].note=e.target.value;return}if(e.target.id==='mask-size'){ui.brushSize=+e.target.value;return}if(e.target.id==='mask-feather'){ui.feather=+e.target.value;return}const k={vprompt:'prompt',vseed:'seed',vsteps:'steps',vwidth:'customWidth',vheight:'customHeight'}[e.target.id];if(k){ui[k]=e.target.value;if(k==='prompt')document.getElementById('prompt-count').textContent=ui.prompt.length+' / 20,000';if(k==='customWidth'||k==='customHeight')refreshSizePreview();updateValidation()}else if(e.target.id==='asset-search'){const pos=e.target.selectionStart;ui.assetQuery=e.target.value;render();const q=document.getElementById('asset-search');q.focus();q.setSelectionRange(pos,pos)}else if(e.target.id==='vsearch'){const pos=e.target.selectionStart;ui.query=e.target.value;ui.galleryPage=1;render();const q=document.getElementById('vsearch');q.focus();q.setSelectionRange(pos,pos)}},true);
