@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:8px 12px}.sidebar nav{flex-wrap:nowrap;overflow-x:auto;justify-content:space-between}.sidebar nav button{flex:0 0 56px;margin:0}.topbar{position:static;flex-wrap:wrap;height:auto;min-height:62px;padding:12px 16px}.top-tools{flex-wrap:wrap;gap:8px}.atelier{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}.controls .dock{position:static}.stage-area{min-height:500px}.big-stage{min-height:350px}.brand{display:none}}@media(max-width:540px){.topbar{align-items:flex-start;flex-direction:column;gap:10px}.top-tools{width:100%;justify-content:space-between}.top-tools .status{font-size:12px}.top-tools select{width:112px}.controls{padding:18px 16px 0}.big-stage{padding:16px}.stage-top{padding:12px 16px}.top-tools button{padding:5px 8px}.controls .task strong{font-size:12px}.stage-area .job{padding:12px 16px}}
.gallery .art-image>div{width:100%}.gallery .art-image{display:block}.controls .utility{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.controls .utility button{font-size:13px;min-height:38px;padding:6px 10px}</style>
</head>
<body>
<a class="skip" href="#main">跳至主要內容</a>
<div class="layout">
<aside class="sidebar"><div class="brand"><div class="monogram">M</div><div><strong>Model Atelier</strong><small>A PLACE TO CREATE</small></div></div><nav aria-label="主要導覽" id="nav"></nav><div class="side-foot">● 本機創作空間<small>介面提案 03 · 非正式平台</small></div></aside>
<div><div class="topbar"><span>工作空間 <span style="margin:0 12px;color:#7f8d82">/</span> <span id="crumb">創作工作台</span></span><span class="status"><span class="dot"></span><span id="engine">示意環境 · 已連線</span></span></div><div class="proposal"><span><strong>互動原型</strong> · 僅本頁示意，不連線、不生成、不訓練。 <a href="PLAN.md">閱讀完整規劃 ↗</a> · <a href="FEATURE-INVENTORY.md">既有功能對照 ↗</a></span><label>情境 <select id="scenario" aria-label="預覽情境"><option value="normal">正常資料</option><option value="empty">空資料</option><option value="missing">缺少元件</option><option value="offline">引擎離線</option></select></label></div><main class="content" id="main" tabindex="-1"></main></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="detail" aria-labelledby="detail-title"></dialog>
<script>
const pages=[['studio','創作工作台','✧','創作'],['gallery','作品庫','▧',''],['experiments','實驗比較','◫',''],['assets','參考素材','▨','資源'],['models','模型庫','▦',''],['training','訓練工作區','◇',''],['system','系統資訊','◉','管理'],['settings','設定','⚙','']];
let page='studio',mode=0,scenario='normal',filter='全部作品',modelType='Checkpoint',stage=0,setting='引擎連線',generated=false;let toastTimer;
const main=document.getElementById('main');
function art(i=0){const palettes=[['#e8ddbd','#b95d3d','#728579','#284c3d'],['#e8c9b6','#9e4a31','#7c777a','#344a49'],['#d4ded3','#bd996a','#86a99b','#335f55'],['#dfdcbf','#c18b50','#78936b','#3d584b']];const c=palettes[i%4];return `<svg viewBox="0 0 420 440" role="img" aria-label="原型示意插畫：日光與層疊山巒" xmlns="http://www.w3.org/2000/svg"><rect width="420" height="440" fill="${c[0]}"/><circle cx="${285-i%3*35}" cy="116" r="57" fill="${c[1]}"/><path d="M0 270Q80 118 177 238T420 190V440H0Z" fill="${c[2]}"/><path d="M0 345Q125 198 242 300T420 258V440H0Z" fill="${c[3]}"/><path d="M181 440Q287 375 236 337T246 279Q222 335 272 353T243 440" fill="${c[0]}" opacity=".75"/><path d="M45 65H90M45 65V110M375 375H330M375 375V330" stroke="${c[3]}" opacity=".4" fill="none"/></svg>`}
function header(k,title,desc,action=''){return `<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`}
function btn(label,action='',primary=false){return `<button class="${primary?'primary':''}" ${action}>${label}</button>`}
function demo(label,primary=false){return btn(label,`data-demo="${label}"`,primary)}
function tabs(items,selected,type){return `<div class="tabs" role="group" aria-label="${type}">${items.map(x=>`<button data-${type}="${x}" aria-pressed="${selected===x}">${x}</button>`).join('')}</div>`}
function empty(title,desc,target='studio'){return `<div class="empty"><div class="eyebrow">A NEW BEGINNING</div><h2>${title}</h2><p>${desc}</p>${btn(target==='studio'?'前往創作工作台':'查看準備方式',`data-page="${target}"`,true)}</div>`}
function notice(){if(scenario==='offline')return `<div class="notice" role="status">引擎未連線（示意） · 仍可瀏覽已保存作品與整理資料。生成與訓練需恢復連線。 ${btn('設定連線','data-page="settings"')}</div>`;if(scenario==='missing')return `<div class="notice" role="status">FLUX 缺少 VAE（情境示例）；只阻擋受影響的流程，其他模型仍可使用。 ${btn('查看缺少元件','data-page="models"')}</div>`;return ''}
const titles=['山間日光','午後的輪廓','森林漫遊','遠方的光','靜謐山谷','綠意之間'];
function library(assets=false){return header(assets?'RESOURCES / REFERENCES':'COLLECTION / YOUR WORK',assets?'每個靈感，都有起點。':'把喜歡的創作，留在這裡。',assets?'整理用途，再選擇相容的創作流程。':'瀏覽、收藏與重用設定，延續每一次好想法。',demo(assets?'＋ 上傳素材':'匯入任務結果',true))+`<div class="toolbar"><input class="search" id="search" type="search" aria-label="搜尋${assets?'素材':'作品'}" placeholder="搜尋${assets?'素材名稱':'作品名稱'}…">${tabs(assets?['全部素材','畫風','結構','角色']:['全部作品','已收藏','已封存'],filter,'filter')}</div>${scenario==='empty'?(assets?'<div class="empty"><h2>收集你的第一張參考圖</h2><p>上傳後可指定用途；不會自動用於訓練。</p>'+demo('＋ 上傳素材',true)+'</div>':empty('作品庫還是一張白紙','完成生成後，明確匯入結果即可在這裡離線查看。')):`<div class="gallery">${titles.map((t,i)=>`<article class="art-card" data-name="${t}" data-kind="${assets?['畫風','結構','角色'][i%3]:i%2?'已收藏':'全部作品'}"><button class="art-image" data-detail="${i}" aria-label="開啟${t}詳情">${art(i)}</button><div class="art-meta"><div class="line"><h3>${t}</h3><span class="tag">${assets?['畫風','結構','角色'][i%3]:i%2?'已收藏':'已匯入'}</span></div><p>${assets?'參考圖 · 1024 × 1024':'SDXL · 示意作品'} / 0${i+1}</p>${assets?btn('用於創作 ↗',`data-use="${i}"`):'<small>示意資料 · 非真實作品</small>'}</div></article>`).join('')}</div><div id="no-results" class="empty" hidden><h2>沒有符合的項目</h2><p>試著更換關鍵字或清除篩選。</p>${btn('清除篩選','id="clear-filter"')}</div>`}`}
function models(){let items=modelType==='Checkpoint'?['示意模型 A','示意模型 B','示意模型 C']:modelType==='LoRA'?['風格 LoRA A','角色 LoRA B','材質 LoRA C']:modelType==='FLUX 元件'?['Diffusion model','Text encoder','VAE']:['控制元件 A','控制元件 B','預處理器 C'];return header('RESOURCES / MODEL LIBRARY','找到適合這次創作的模型。','先看支援用途，再確認架構、元件與來源。',demo('↻ 同步模型清單',true))+`<div class="toolbar">${tabs(['Checkpoint','LoRA','結構控制','參考元件','FLUX 元件'],modelType,'modeltype')}<span class="subhead">同步不會下載權重</span></div>${scenario==='empty'?empty('尚未同步模型清單','先準備引擎與模型，再同步既有檔案。','settings'):`<div class="card-grid">${items.map((name,i)=>`<article class="panel"><div class="model-symbol">${['Aa','◈','∿'][i]}</div><div class="actions" style="margin-bottom:12px"><span class="tag">${modelType}</span><span class="tag ${i===2||scenario==='missing'?'warm':'gray'}">${i===2||scenario==='missing'?'待補元件':'已登記 · 仍需預檢'}</span></div><h2>${name}</h2><p class="muted">${modelType==='Checkpoint'?'文字創作 / 圖片重繪 · 尺寸預設示例：1024×1024、896×1152、1152×896；仍需流程預檢':'依相容流程使用'}</p><div class="list-row"><small>登記架構</small><strong>${modelType==='FLUX 元件'?'FLUX':'SDXL'}</strong></div><details><summary>來源、授權與檔案資訊</summary><p class="help">正式版顯示原來源、版本、hash 與待核實缺口。此原型沒有真實模型權重。</p></details>${demo('套用到創作')}</article>`).join('')}</div>`}`}
function training(){return header('TRAIN / A GUIDED WORKSPACE','讓每一步訓練，都有依據。','從資料品質開始，明確準備、啟動與檢視產物。',demo('查看原 run 報告'))+`<div class="stagebar" role="group" aria-label="訓練階段">${['審查資料','匯出資料包','準備訓練','執行與產物'].map((s,i)=>`<button data-stage="${i}" aria-pressed="${stage===i}"><b>0${i+1}</b>${s}<small>${['補齊標註與來源','建立固定版本','凍結 run 設定','追蹤結果與比較'][i]}</small></button>`).join('')}</div>${scenario==='empty'?empty('尚未建立訓練資料集','先依既有 T02 清單準備資料，再匯入進行逐張審查。','assets'):stage===0?`<div class="notice">示意資料集：12 張候選 / 3 張待補資料。完成審查後才可匯出訓練資料包。</div><section class="panel review"><div class="review-thumbs">${[0,1,2].map(i=>`<button class="thumb" data-review="${i}" aria-label="查看第 ${i+1} 張待審圖片">${art(i)}</button>`).join('')}<small>只顯示待補項目</small></div><div class="review-art" id="review-art">${art(0)}</div><div class="review-form"><div class="panel-heading"><h2 id="review-title">圖片 01</h2><span class="tag warm">待審查</span></div><label class="field"><span>圖片描述 / Caption</span><textarea>層疊山巒與午後日光，紙感插畫。</textarea></label><label class="field"><span>來源記錄</span><input placeholder="填寫可追溯來源（原型不保存）"></label><label class="field"><span>資料分組</span><select><option>訓練候選</option><option>開發評估</option><option>排除</option></select></label>${demo('保存審查並下一張',true)}<p class="help">正式版需同時完成來源、角色與分組等必要審查。</p></div></section>`:stage===1?`<section class="panel"><h2>資料出口檢查</h2><p class="muted">以固定資料版本匯出；評估圖不會混入 train-only 訓練集。</p>${['圖片描述已填寫','來源與使用條件仍缺 3 項','資料分組已指定'].map((x,i)=>`<div class="list-row"><strong>${x}</strong><span class="tag ${i===1?'warm':''}">${i===1?'需處理':'示意通過'}</span></div>`).join('')}<div class="actions" style="margin-top:20px">${btn('回到待審圖片','data-stage="0"',true)}<button disabled>匯出資料包 · 尚有缺項</button></div></section>`:stage===2?`<section class="panel"><h2>準備新的訓練 run</h2><p class="muted">這一步只準備凍結設定。開始訓練是另一個明確操作。</p><div class="row"><label class="field"><span>Run 名稱</span><input value="山巒風格 · 第一輪"></label><label class="field"><span>基礎模型</span><select><option>SDXL 示意模型</option></select></label></div><div class="notice">資料版本尚有缺項，此示意 run 暫不可準備。</div><button disabled>準備 run</button></section>`:`<div class="split"><section class="panel"><div class="panel-heading"><h2>示意 run · 進度</h2><span class="tag">展示紀錄</span></div><div class="metric">620 <small>/ 1,000 steps</small></div><div class="progress"><span></span></div><p class="muted">此為另一筆示意紀錄，非前述待審資料的實際執行結果。</p><div class="actions">${demo('停止訓練')}${demo('查看原 run 日誌')}</div><details><summary>凍結設定與原請求 UUID</summary><p class="help">回應不明時查回原 UUID；續訓建立新 run 並記錄來源。</p></details></section><section class="panel"><h2>產物與下一步</h2><p class="muted">完成後依序安裝產物、回登模型與進行固定比較。</p>${demo('查看產物紀錄')}${btn('前往實驗比較','data-page="experiments"')}</section></div>`}`}
function experiments(){return header('COMPARE / LEARN FROM EVERY TRY','一次比較，一個明確問題。','固定其他條件，觀察設定變化；每一組仍由你明確生成。',demo('＋ 建立比較方案',true))+`${scenario==='empty'?empty('尚無比較方案','先選定模型、提示詞與比較軸，再保存方案。'):`<section class="panel" style="margin-bottom:22px"><div class="panel-heading"><h2>山巒插畫 · 取樣步數比較</h2><span class="tag warm">新增獨立入口提案</span></div><div class="actions"><span class="tag gray">固定 Seed：12345</span><span class="tag gray">相同模型與提示詞</span><span class="tag gray">固定 1024 × 1024 · 1.05 MP</span><span class="tag gray">3 組 · 每次 1 張</span></div></section><div class="experiment">${[20,28,36].map((v,i)=>`<section class="panel"><div class="panel-heading"><h2>${v} steps</h2><span class="tag ${i===2?'warm':''}">${i===2?'未開始':'已匯入'}</span></div>${i===2?'<div class="empty" style="padding:48px 12px;margin-bottom:14px"><p>等待明確生成</p></div>':art(i)}<p class="help">${i===2?'載入設定不會自動生成。':'示意結果，請以人工檢視判斷品質。'}</p>${demo(i===2?'載入此組設定':'記錄人工評分')}</section>`).join('')}</div>`}`}
function values(entries){return `<dl class="env-values">${entries.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`}
function system(){const unknown=scenario==='empty',offline=scenario==='offline';const val=x=>unknown?'未知':x;const eng=x=>unknown||offline?'未知':x;return header('ENVIRONMENT / HOST • ENGINE • STORAGE','系統資訊','平台硬體、引擎環境與資料位置完整保留，各自標示來源及更新時間。',demo('↻ 重新整理主機與引擎',true))+`<nav class="jump-links" aria-label="系統資訊區塊"><a href="#host-info">平台主機</a><a href="#engine-info">引擎執行環境</a><a href="#storage-info">目錄與磁碟容量</a><a href="#local-info">本機安裝檢查</a><a href="#deployment-info">部署與存取</a></nav>
<section id="host-info" class="env-section"><div class="env-heading"><div><div class="scope">來源 A / 平台程序所在主機</div><h2>平台主機資訊</h2></div><span class="tag gray">DEMO-WORKSTATION · 原生 Windows</span></div><p class="source-note">RAM／磁碟：平台本機系統查詢 · GPU／驅動：nvidia-smi。正式版每 15 秒更新；本頁所有讀值均為示意。</p>${unknown?'<div class="notice">主機資料尚未取得；保留欄位與未知狀態，不顯示為 0。</div>':''}<div class="env-grid"><article class="panel"><div class="subhead">GPU 0 · NVIDIA GeForce RTX 4080（示意）</div><div class="metric">${val('12.0')} <small>GiB 可用 / ${val('16.0')}</small></div><div class="meter"><span style="width:${unknown?0:25}%"></span></div><div class="memory-list">專用顯存已用：${val('4.0 GiB')}<br>驅動：${val('示意版本')}<br>多張 GPU 各自顯示，不只取第一張。</div></article><article class="panel"><div class="subhead">RAM · 平台主機系統記憶體</div><div class="metric">${val('40.0')} <small>GiB 可用 / ${val('64.0')}</small></div><div class="meter"><span style="width:${unknown?0:37.5}%"></span></div><div class="memory-list">已用：${val('24.0 GiB')}<br>主機 RAM 不代表引擎主機 RAM。</div></article><article class="panel"><div class="subhead">磁碟 · 平台資料目錄所在磁碟</div><div class="metric">${val('320')} <small>GiB 可用 / ${val('1,000')}</small></div><div class="meter"><span style="width:${unknown?0:68}%"></span></div><div class="memory-list">已用：${val('680 GiB')}<code class="path">C:\\Atelier\\data</code></div></article></div><div class="panel" style="margin-top:16px">${values([['主機名稱','DEMO-WORKSTATION（示意）'],['作業系統',val('Windows（示意）')],['平台 Python',val('3.12.x（示意）')],['部署範圍','原生平台（示意）'],['資料目錄','C:\\Atelier\\data'],['更新時間',unknown?'尚無資料':'示意快照 · 非即時量測']])}<p class="help">若改為容器部署，顯示容器可見 Linux／RAM／掛載磁碟／GPU；不當作 Windows 宿主機完整資訊。更新失敗時保留上次快照並標示過期。</p></div></section>

function studio(){const names=['文字創作','圖片重繪','局部修補','結構引導','風格參考'];const [w,h]=dims();const e=validation();return header('','創作工作台','選擇目的、描述畫面，再確認模型與尺寸。',demo('草稿與設定交換'))+`<div class="atelier"><section class="controls" aria-label="創作設定"><div class="tasks" role="group" aria-label="創作目的">${names.map((n,i)=>`<button class="task" data-vmode="${i}" aria-pressed="${mode===i}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${svgPaths[i]}"/></svg><strong>${n}</strong></button>`).join('')}</div>${mode?`<div class="inline-source"><strong>來源素材</strong><p class="help">${ui.source?esc(ui.source):'尚未選擇；選取後仍需確認輸入與處理方式。'}</p>${btn('選擇參考素材','data-page="assets"')}</div>`:''}<label class="field"><span>描述你想創作的畫面</span><textarea id="vprompt" maxlength="20000">${esc(ui.prompt)}</textarea></label><label class="field"><span>模型</span><select id="vmodel"><option ${ui.arch==='SDXL'?'selected':''}>SDXL</option>${mode<2?`<option ${ui.arch==='FLUX'?'selected':''}>FLUX</option>`:''}</select></label><div class="field"><span>輸出尺寸 · 比例與實際像素</span><div class="size-buttons" role="group" aria-label="尺寸預設">${presets[ui.arch].map(([x,y],i)=>`<button data-vsize="${i}" aria-pressed="${i===ui.size}"><i aria-hidden="true" style="width:${20*x/Math.sqrt(x*y)}px;height:${20*y/Math.sqrt(x*y)}px"></i>${ratio(x,y)}<small>${x} × ${y}</small></button>`).join('')}</div><p class="help">${w} × ${h} · ${mp(w,h)}。${ui.arch==='FLUX'?'16':'8'} 的倍數；預設為示例，不代表所有配置已實測。</p>${mode>0?'<p class="help">優先保留來源構圖；若尺寸不合法，正式版先顯示縮放／補邊／裁切預覽並確認，不直接沿用。</p>':''}</div>${mode===3?'<label class="field"><span>結構方式</span><select><option>Canny 輪廓</option><option>Pose 姿勢</option><option>Depth 深度</option></select></label>':''}${mode===4?'<label class="field"><span>參考目的</span><select><option>畫風特徵</option><option>角色特徵</option></select></label><p class="help">單張參考，不保證身份一致。</p>':''}<div class="utility">${btn('草稿與設定交換','data-transfer="true"')}${btn('相容性與實測','data-validation="true"')}</div><details id="vadvanced"><summary>進階設定</summary><label class function paintMask(){const c=document.getElementById('mask-canvas');if(!c)return;c.width=600;c.height=Math.round(600*dims()[1]/dims()[0]);const x=c.getContext('2d');function draw(){x.clearRect(0,0,c.width,c.height);for(const st of ui.mask){x.globalCompositeOperation=st.erase?'destination-out':'source-over';x.fillStyle='#b9d3a4';x.beginPath();x.arc(st.x*c.width,st.y*c.height,st.r*c.width,0,7);x.fill()}x.globalCompositeOperation='source-over'}draw();let down=false;const add=e=>{const b=c.getBoundingClientRect();ui.mask.push({x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,r:.035,erase:ui.tool==='erase'});draw()};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);add(e)};c.onpointermove=e=>{if(down)add(e)};c.onpointerup=c.onpointercancel=()=>down=false}

function updateValidation(){const e=validation();document.getElementById('vcheck').textContent=e.length?e.join(' '):'✓ 預檢示例通過 · 1 張 · '+dims().join(' × ');document.getElementById('vgenerate').disabled=!!e.length;for(const [id,k]of [['vseed','seed'],['vsteps','steps']]){const bad=e.some(t=>t.startsWith(k==='seed'?'Seed':'取樣'));document.getElementById(id).setAttribute('aria-invalid',String(bad));if(bad)document.getElementById('vadvanced').open=true}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;let handled=true;if(d.vmode!==undefined){mode=+d.vmode;if(mode>1&&ui.arch==='FLUX'){ui.arch='SDXL';ui.steps='20';ui.size=0}generated=false;render()}else if(d.vsize!==undefined){ui.size=+d.vsize;render()}else if(b.id==='vgenerate'){if(validation().length)return;generated=true;render();tell('已切換完成狀態；沒有實際生成。')}else if(d.vfilter){filter=d.vfilter;render()}else if(d.vview){ui.view=d.vview;render()}else if(d.vfav!==undefined){records[+d.vfav].fav=!records[+d.vfav].fav;render()}else if(d.vselect!==undefined){const i=+d.vselect;if(ui.chosen.includes(i))ui.chosen=ui.chosen.filter(x=>x!==i);else if(ui.chosen.length<4)ui.chosen.push(i);else tell('最多比較 4 張作品。');render()}else if(d.vclearSelection!==undefined){ui.chosen=[];render()}else if(d.vclear!==undefined){filter='全部作品';ui.query='';ui.modelFilter='全部模型';render()}else if(d.varchive!==undefined){const i=+d.varchive;records[i].archived=!records[i].archived;ui.chosen=ui.chosen.filter(x=>x!==i);document.getElementById('detail').close();render()}else if(d.vcompare!==undefined){const dialog=document.getElementById('detail');dialog.innerHTML=`<div class="panel-heading"><h2 id="detail-title">並排比較 · ${ui.chosen.length} 張</h2>${btn('關閉','data-close="true"')}</div><div class="compare-grid">${ui.chosen.map(i=>{const r=records[i];return `<div>${picture(i,r.w,r.h)}<h3>${r.title}</h3><p>${r.w} × ${r.h}</p></div>`}).join('')}</div><p class="help">保留真實比例；不同輸出尺寸需留意構圖差異。</p>`;dialog.showModal()}else if(d.use!==undefined){const i=+d.use;mode=i%3===1?3:4;ui.arch='SDXL';ui.size=0;ui.steps='20';ui.source=titles[i];go('studio');tell('已帶入參考素材示例，請確認後再生成。')}else if(d.mask){if(d.mask==='clear')ui.mask=[];else if(d.mask==='center')ui.mask.push({x:.5,y:.5,r:.2,erase:false});else ui.tool=d.mask;paintMask()}else if(d.transfer!==undefined||d.validation!==undefined||d.retained!==undefined){const dialog=document.getElementById('detail');const transfer=d.transfer!==undefined,valid=d.validation!==undefined;dialog.innerHTML=`<div class="panel-heading"><h2 id="detail-title">${transfer?'草稿與設定交換':valid?'相容性與實測':'任務與歷史資訊'}</h2>${btn('關閉','data-close="true"')}</div>${transfer?`<p>依流程支援能力提供草稿及設定交換；專用流程不顯示不支援的保存能力。</p><div class="actions">${demo('新建草稿')}${demo('載入草稿')}${demo('保存草稿')}${demo('匯入設定 JSON')}${demo('匯出設定 JSON')}</div><details open><summary>套用前確認與能力範圍</summary><p>正式版保留差異比對、原始參數、模型預設確認與各版本支援範圍，載入不自動生成。</p></details>`:valid?`<p>模型登記、元件齊全、裝置可用與指定配置實測為不同判斷。</p><div class="actions">${demo('查看模型實測')}${demo('查看 LoRA 實測')}${demo('查看有序組合紀錄')}${demo('查看資源建議')}</div>`:`<p>示意任務 · ${generated?'已完成，待加入作品庫':'尚未執行'}。正式版保留任務分頁、原請求恢復與狀態相符的操作。</p><div class="actions">${demo('更新任務狀態')}${demo('較舊任務')}${demo('查回原請求 UUID')}${demo('取消排隊')}${demo('停止原引擎任務')}${demo('載入原設定')}${demo('下載原 workflow')}${demo('加入作品庫')}</div><details open><summary>耗時與連續資源取樣</summary><p>提交到終態耗時、原引擎執行耗時、提交前 RAM／VRAM、取樣起訖／成功失敗／間隔缺口／觀察最高值／最近取樣與結束原因。示意無歷史讀值，保持未知。</p></details><details><summary>提交時環境、模型與來源快照</summary><p>保留引擎 Python／Torch／CUDA／裝置、流程 hash、平台依賴、模型與有序 LoRA、ControlNet／adapter／編碼器、素材前處理與條件圖；不以目前環境回填。</p></details>`}`;dialog.showModal()}else handled=false;if(handled){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('input',e=>{const k={vprompt:'prompt',vseed:'seed',vsteps:'steps'}[e.target.id];if(k){ui[k]=e.target.value;updateValidation()}else if(e.target.id==='vsearch'){const pos=e.target.selectionStart;ui.query=e.target.value;render();const q=document.getElementById('vsearch');q.focus();q.setSelectionRange(pos,pos)}},true);
document.addEventListener('change',e=>{if(e.target.id==='vmodel'){ui.arch=e.target.value;ui.steps=ui.arch==='FLUX'?'4':'20';ui.size=0;render()}else if(e.target.id==='vmodel-filter'){ui.modelFilter=e.target.value;render()}},true);

const previewTop=document.querySelector('.topbar');previewTop.firstElementChild.innerHTML='<span id="crumb">創作工作台</span>';
const topTools=document.createElement('div');topTools.className='top-tools';topTools.append(previewTop.lastElementChild);const scenarioLabel=document.createElement('label');scenarioLabel.setAttribute('aria-label','預覽情境');scenarioLabel.append(document.getElementById('scenario'));topTools.append(scenarioLabel);const info=document.createElement('button');info.textContent='原型說明';info.onclick=()=>{const d=document.getElementById('detail');d.innerHTML='<div class="panel-heading"><h2 id="detail-title">互動原型說明</h2><button data-close="true">關閉</button></div><p>依提供的 UI 範例整合。所有數據與圖像均為示意，不連線、不生成、不訓練，也不修改正式平台。</p><p>收藏、封存、比較、尺寸及遮罩僅保存在本頁記憶體，重新整理會重設。下載與保存操作僅展示位置。</p><p><a href="PLAN.md">詳細規劃</a> · <a href="FEATURE-INVENTORY.md">既有功能保留對照</a> · <a href="INTEGRATION-NOTES.md">文件整合決策</a></p>';d.showModal()};topTools.append(info);previewTop.append(topTools);
if(pages.some(p=>p[0]===location.hash.slice(1)))page=location.hash.slice(1);filter=page==='assets'?'全部素材':'全部作品';render();
</script>
